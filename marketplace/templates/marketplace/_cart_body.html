{% for item in cart_items %}
<tr>
  <td>
    <div class="d-flex align-items-center">
      <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}"
           width="60" height="60" class="rounded me-3" style="object-fit:cover;">
      <div>
        <h6 class="mb-0">{{ item.product.name }}</h6>
        <small class="text-muted">Sold by {{ item.product.farmer.username }}</small>
      </div>
    </div>
  </td>
  <td>₦{{ item.product.price }}</td>
  <td>
    <div class="btn-group" role="group">
      <button class="btn btn-sm btn-outline-secondary"
              hx-post="{% url 'update_cart_item' item.id %}"
              hx-vals='{"action":"decrease"}'
              hx-target="#cart-body"
              hx-swap="innerHTML">−</button>
      <span class="btn btn-sm btn-light disabled" style="min-width:44px;">{{ item.quantity }}</span>
      <button class="btn btn-sm btn-outline-secondary"
              hx-post="{% url 'update_cart_item' item.id %}"
              hx-vals='{"action":"increase"}'
              hx-target="#cart-body"
              hx-swap="innerHTML">+</button>
    </div>
  </td>
  <td class="fw-bold">₦{{ item.total_price }}</td>
  <td>
    <button class="btn btn-sm btn-outline-danger"
            hx-post="{% url 'update_cart_item' item.id %}"
            hx-vals='{"action":"remove"}'
            hx-target="#cart-body"
            hx-swap="innerHTML"
            hx-confirm="Remove this item?">
      <i class="fas fa-trash"></i>
    </button>
  </td>
</tr>
{% empty %}
<tr>
  <td colspan="5" class="text-center py-4 text-muted">Your cart is empty.</td>
</tr>
{% endfor %}

<tr class="table-light">
  <td colspan="3" class="text-end fw-bold">Total:</td>
  <td class="fw-bold">₦{{ cart.total_price }}</td>
  <td></td>
</tr>
