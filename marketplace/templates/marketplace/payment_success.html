{% extends 'base.html' %}
{% block title %}Payment Successful{% endblock %}

{% block content %}
<div class="text-center py-5">
  <i class="fas fa-check-circle fa-5x text-success mb-4"></i>
  <h2 class="fw-bold">Payment Successful 🎉</h2>
  <p class="lead">Thank you! Your order has been confirmed.</p>
  <p class="text-muted">Reference: <code>{{ reference }}</code></p>
  <p class="fs-4">Amount paid: <strong>₦{{ amount_naira|floatformat:2 }}</strong></p>
  <div class="mt-4 d-flex justify-content-center gap-3">
    <a href="{% url 'buyer_dashboard' %}" class="btn btn-success">View My Orders</a>
    <a href="{% url 'marketplace' %}" class="btn btn-outline-success">Keep Shopping</a>
  </div>
</div>
{% endblock %}
