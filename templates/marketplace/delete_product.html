{% extends 'base.html' %}
{% block title %}Delete {{ product.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Delete Product</h4>
      </div>
      <div class="card-body text-center p-4">
        <img src="{{ product.image.url }}" alt="{{ product.name }}"
             class="img-fluid rounded mb-3" style="max-height:200px;object-fit:cover;">

        <p class="mb-3">
          Are you sure you want to permanently delete
          <strong>{{ product.name }}</strong>?
        </p>
        <p class="text-danger small mb-4">
          <i class="fas fa-info-circle me-1"></i>
          This action cannot be undone. Existing orders are not affected.
        </p>

        <form method="post" class="d-flex justify-content-center gap-2">
          {% csrf_token %}
          <a href="{% url 'farmer_dashboard' %}" class="btn btn-outline-secondary">
            <i class="fas fa-times me-1"></i>Cancel
          </a>
          <button type="submit" class="btn btn-danger">
            <i class="fas fa-trash me-1"></i>Yes, Delete
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
